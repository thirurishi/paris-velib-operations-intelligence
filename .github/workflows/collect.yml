# Runs the Vélib' collector every 15 minutes on GitHub's servers and commits
# the new Parquet file back into this repo (folder data/).
name: Collect Vélib data

on:
  schedule:
    # Minutes 7, 22, 37 and 52 of every hour (UTC).
    # Not :00/:15/:30/:45 on purpose: GitHub is busiest on round minutes,
    # so runs there are delayed or dropped more often.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# The job needs to push commits, so it must be allowed to write repo contents.
permissions:
  contents: write

# Never let two collector runs overlap; a late run waits for the previous one.
concurrency:
  group: collect-velib
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: Install dependencies
        run: pip install -r requirements-collect.txt

      - name: Collect one snapshot
        env:
          PYTHONPATH: src
        run: python -m velib.collect

      - name: Commit and push the new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # If you pushed code in the meantime, rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push failed (attempt $attempt), retrying in 10 s..."
            sleep 10
          done
          exit 1
