# Lints and tests the code on every push and pull request.
# Data-only commits from the collector do not trigger it (they are pushed with
# GITHUB_TOKEN, which never starts other workflows).
name: CI

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest -v
