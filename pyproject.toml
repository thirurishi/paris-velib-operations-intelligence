[project]
name = "velib"
version = "0.1.0"
description = "Paris Vélib' Operations Intelligence: live data pipeline, shortage forecasts and truck rebalancing."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long user-facing strings are kept whole

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # path setup must run before project imports
"app/*" = ["E402"]
