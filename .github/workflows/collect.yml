# Collects Vélib' data every 15 minutes and commits it to data/.
#
# How it works:
#   One run stays alive for ~5.5 hours and collects every 15 minutes itself
#   (scripts/collect_loop.sh). Just before it ends, it starts the next run, so the
#   chain never stops. The cron below is only a safety net that restarts the chain
#   if it ever breaks. GitHub's cron alone is NOT reliable enough for 15-min data.
#
# Cost: ~1,400 Actions minutes/day, free on PUBLIC repos. On a private repo the
# loop is switched off automatically (one collection per run) to protect your quota.
name: Collect Vélib data

on:
  schedule:
    - cron: "3 */2 * * *" # safety net: every 2 hours (UTC)
  workflow_dispatch: # "Run workflow" button, also used by the self-restart

permissions:
  contents: write # push the data commits
  actions: write # start the next run of this workflow

# Only one collector at a time. A new run waits until the current one finishes.
concurrency:
  group: collect-velib
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: Install dependencies
        run: pip install -r requirements-collect.txt

      - name: Check repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" >> "$GITHUB_OUTPUT"

      - name: Collect every 15 minutes
        env:
          PYTHONPATH: src
          # 0 = collect once and stop (private repo, protects the free quota)
          LOOP_MINUTES: ${{ steps.repo.outputs.private == 'true' && '0' || '330' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/collect_loop.sh

      - name: Start the next run (keeps the chain going)
        # Skipped if you cancel the run (your "stop" button) or the repo is private.
        if: ${{ !cancelled() && steps.repo.outputs.private == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"
